# Pubblica ogni giorno il post social di Bleo (src/data/social.ts) su
# Instagram, pagina Facebook e profilo LinkedIn. Come collegare i social:
# social/README.md. Un social senza credenziali viene saltato.
name: Post social di Bleo

on:
  schedule:
    # 16:41 UTC: 17:41 d'inverno e 18:41 d'estate in Svizzera. Non all'ora
    # esatta, quando GitHub è più carico e può ritardare.
    - cron: "41 16 * * *"
  workflow_dispatch:
    inputs:
      data:
        description: "Giorno del post (AAAA-MM-GG). Vuoto: oggi."
        required: false
      piattaforme:
        description: "Social, separati da virgole"
        required: false
        default: "instagram,facebook,linkedin"
      prova:
        description: "Solo prova: mostra testi e immagini senza pubblicare"
        type: boolean
        default: true

permissions:
  # Per salvare social/storico.json nel repository dopo la pubblicazione.
  contents: write

concurrency:
  group: post-social
  cancel-in-progress: false

jobs:
  pubblica:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: pubblica
        run: npm run social:pubblica
        env:
          SOCIAL_DATA: ${{ inputs.data }}
          SOCIAL_PIATTAFORME: ${{ inputs.piattaforme }}
          SOCIAL_PROVA: ${{ inputs.prova }}
          # Finché non c'è il dominio definitivo: imposta la variabile SITO_URL quando cambia.
          SITO_URL: ${{ vars.SITO_URL || 'https://bussola-ticino.netlify.app' }}
          FACEBOOK_PAGE_ID: ${{ vars.FACEBOOK_PAGE_ID }}
          INSTAGRAM_USER_ID: ${{ vars.INSTAGRAM_USER_ID }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_TOKEN }}
      # Il registro di cosa è uscito resta nel repository: evita di ripubblicare
      # lo stesso post e serve per le statistiche. Anche se un social ha dato
      # errore, gli altri pubblicati vanno registrati. [skip netlify]: il sito
      # non cambia, niente build.
      - name: Salva il registro delle pubblicazioni
        if: always() && steps.pubblica.outcome != 'skipped'
        run: |
          git diff --quiet -- social/storico.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add social/storico.json
          git commit -m "Social: registro delle pubblicazioni [skip netlify]"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
